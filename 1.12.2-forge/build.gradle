buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0.0"
group = mod_group_id
archivesBaseName = "fast-workstations-1.12.2-forge"

ext.mod_id = "itamiofastws"
ext.mod_name = "Fast Workstations — Itamio Port"
ext.mod_description = "Furnaces and hoppers process one item per tick by default; the tick rate is configurable."
ext.mod_license = "MIT"

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
    // The checked-in itamiofastws.refmap.json is authoritative; disabling
    // annotation processing also avoids MixinBooter's MixinExtras AP, which
    // assumes an FML runtime and crashes javac.
    options.compilerArgs += ['-proc:none']
}

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
    maven { name = 'CleanroomMC'; url = 'https://maven.cleanroommc.com/' }
}

dependencies {
    // MixinBooter supplies Sponge Mixin at runtime for 1.12.2 Forge. It is NOT
    // shaded into this mod: users install it as a separate mod (see mcmod.info).
    compile 'zone.rong:mixinbooter:8.6'
}

// MixinBooter's IEarlyMixinLoader is discovered via this FML core plugin.
jar {
    manifest {
        attributes 'FMLCorePlugin': 'itamio.iamfastworkstations.core.FastWorkstationsCorePlugin',
                   'FMLCorePluginContainsFMLMod': 'true'
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_description", project.mod_description
    inputs.property "mod_license", project.mod_license

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info', 'pack.mcmeta'
        expand 'version': project.version,
               'mcversion': project.minecraft.version,
               'mod_id': project.mod_id,
               'mod_name': project.mod_name,
               'mod_description': project.mod_description,
               'mod_license': project.mod_license
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info', 'pack.mcmeta'
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'getAssets') {
        task.enabled = false
    }
}
